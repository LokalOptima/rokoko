# project.conf — Project-specific configuration for agent-guide hooks and rules.
# This is the ONLY file you need to customize per project.
# All other agent-guide files are generic and portable.

# Build command. Must exit 0 on success.
# Examples: "make -j$(nproc)", "cmake --build build", "cargo build"
BUILD_CMD="make"

# Build directory. If it doesn't exist, build gate is skipped (fresh clone).
# Leave empty for Makefile-based projects (build artifacts in source tree).
BUILD_DIR=""

# Test command. Must exit 0 on success.
# Examples: "./scripts/test_correctness.sh", "cargo test", "pytest tests/"
TEST_CMD="make test"

# Benchmark command (optional). Used by perf commits.
# Examples: "./scripts/bench.sh 100", "cargo bench", "pytest bench/ --benchmark-only"
BENCH_CMD="make bench"

# Source file patterns (space-separated globs). Changes to these trigger build+test gates.
# Examples: "*.cu *.cuh *.cpp *.h" "*.rs" "*.py"
SOURCE_PATTERNS="*.cu *.cuh *.cpp *.h *.hpp *.py"

# Files that should never be committed (space-separated globs).
# The pre-commit hook will hard-block if these are staged.
SECRET_PATTERNS=".env .env.* credentials.json *.pem *.key"

# Scratch directory for agent workspace (gitignored, not reviewed).
SCRATCH_DIR="scratch"
